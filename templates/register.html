{% extends 'base.html' %}

{% block title %}Registrazione - Calcolatore di serie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Crea un account</h1>

                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ username or '' }}" minlength="3" maxlength="80"
                               autocomplete="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ email or '' }}" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               minlength="8" autocomplete="new-password" required>
                        <div class="form-text">Almeno 8 caratteri.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Conferma password</label>
                        <input type="password" class="form-control" id="confirm_password"
                               name="confirm_password" minlength="8"
                               autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Registrati</button>
                </form>

                <p class="text-center small mt-3 mb-0">
                    Hai già un account?
                    <a href="{{ url_for('frontend.login') }}">Accedi</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
