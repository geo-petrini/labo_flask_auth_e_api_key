{% extends 'base.html' %}

{% block title %}Login - Calcolatore di serie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Accedi</h1>

                <form method="post">
                    <div class="mb-3">
                        <label for="identifier" class="form-label">Username o email</label>
                        <input type="text" class="form-control" id="identifier" name="identifier"
                               value="{{ identifier or '' }}" autocomplete="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Ricordami</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Accedi</button>
                </form>

                <p class="text-center small mt-3 mb-0">
                    Non hai un account?
                    <a href="{{ url_for('frontend.register') }}">Registrati</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
